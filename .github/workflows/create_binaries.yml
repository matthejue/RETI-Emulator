name: Build release artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-22.04
            platform: linux
            architecture: x64
            archive: reti-emulator-linux-x86_64.tar.gz
          - name: Windows x86-64
            runner: windows-2022
            platform: windows
            architecture: x64
            archive: reti-emulator-windows-x86_64.zip
          - name: macOS 11+ x86-64
            runner: macos-15-intel
            platform: macos
            architecture: x64
            archive: reti-emulator-macos-x86_64.tar.gz
          - name: macOS 11+ arm64
            runner: macos-15
            platform: macos
            architecture: arm64
            archive: reti-emulator-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.architecture }}

      - name: Install source debugger freezer
        run: python -m pip install --upgrade "pyinstaller>=6.10,<7"

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl musl-tools patchelf python3-tk
          python -m pip install --upgrade staticx

      - name: Build static ncurses
        if: matrix.platform == 'linux'
        run: |
          mkdir -p binary/downloads binary/sources
          curl --fail --location --retry 3 https://ftp.gnu.org/pub/gnu/ncurses/ncurses-6.5.tar.gz --output binary/downloads/ncurses-6.5.tar.gz
          echo "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6  binary/downloads/ncurses-6.5.tar.gz" | sha256sum --check
          tar -C binary/sources -xzf binary/downloads/ncurses-6.5.tar.gz
          cd binary/sources/ncurses-6.5
          CC=musl-gcc ./configure \
            --prefix="$GITHUB_WORKSPACE/binary/linux-x86_64/ncurses" \
            --enable-static \
            --disable-shared \
            --enable-widec \
            --with-termlib \
            --without-ada \
            --without-cxx-binding \
            --without-gpm \
            --with-fallbacks=xterm,xterm-256color,screen,screen-256color,linux,vt100 \
            --without-debug
          make -j2
          make install

      - name: Install MSYS2 build environment
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: gcc make ncurses

      - name: Build Linux package
        if: matrix.platform == 'linux'
        run: |
          make LINUX_STATIC=1 RELEASE=1 CC=musl-gcc NCURSES_PREFIX="$GITHUB_WORKSPACE/binary/linux-x86_64/ncurses"
          ./binary/reti_emulator_main -h
          mkdir -p binary/smoke
          cp .github/release/android/smoke.reti .github/release/android/smoke.sections binary/smoke/
          ./binary/reti_emulator_main -t -S binary/smoke/smoke.sections binary/smoke/smoke.reti
          test -f binary/smoke/smoke.output
          if ldd ./binary/reti_emulator_main; then
            echo "Linux emulator is not fully static" >&2
            exit 1
          fi
          python -m PyInstaller --clean --noconfirm --onefile --name source_debug --distpath binary --workpath binary/build/source-debug source/debug/source_debug.py
          staticx binary/source_debug binary/source_debug-static
          mkdir -p binary/release/reti-emulator/libexec/reti-emulator binary/release/reti-emulator/source/debug
          cp binary/reti_emulator_main binary/release/reti-emulator/reti_emulator
          cp binary/source_debug-static binary/release/reti-emulator/libexec/reti-emulator/source_debug
          cp source/debug/source_debug.py binary/release/reti-emulator/source/debug/source_debug.py
          cp README.md binary/release/reti-emulator/README.md
          tar -C binary/release -czf "$GITHUB_WORKSPACE/binary/${{ matrix.archive }}" reti-emulator

      - name: Build Windows emulator
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          make WINDOWS=1 RELEASE=1
          ./binary/reti_emulator_main -h
          mkdir -p binary/smoke
          cp .github/release/android/smoke.reti .github/release/android/smoke.sections binary/smoke/
          ./binary/reti_emulator_main -t -S binary/smoke/smoke.sections binary/smoke/smoke.reti
          test -f binary/smoke/smoke.output
          mkdir -p binary/release/reti-emulator/libexec/reti-emulator binary/release/reti-emulator/source/debug
          cp binary/reti_emulator_main.exe binary/release/reti-emulator/reti_emulator.exe
          cp source/debug/source_debug.py binary/release/reti-emulator/source/debug/source_debug.py
          cp README.md binary/release/reti-emulator/README.md
          for dll in $(ldd binary/reti_emulator_main.exe | awk '/\/usr\/bin\/msys-.*\.dll/ { for (i = 1; i <= NF; i++) if ($i ~ /^\/usr\/bin\/msys-.*\.dll$/) print $i }' | sort -u); do
            cp "$dll" binary/release/reti-emulator/
          done

      - name: Freeze and archive Windows source debugger
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --name source_debug --distpath binary\helper-dist --workpath binary\build\source-debug source/debug/source_debug.py
          Copy-Item binary\helper-dist\source_debug.exe binary\release\reti-emulator\libexec\reti-emulator\source_debug.exe
          Compress-Archive -Path binary\release\reti-emulator -DestinationPath "binary\${{ matrix.archive }}"

      - name: Build macOS package
        if: matrix.platform == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          make MACOS=1 RELEASE=1
          ./binary/reti_emulator_main -h
          mkdir -p binary/smoke
          cp .github/release/android/smoke.reti .github/release/android/smoke.sections binary/smoke/
          ./binary/reti_emulator_main -t -S binary/smoke/smoke.sections binary/smoke/smoke.reti
          test -f binary/smoke/smoke.output
          if otool -L binary/reti_emulator_main | grep -E '/(usr/local|opt/homebrew)/'; then
            echo "macOS emulator links to a non-system library" >&2
            exit 1
          fi
          python -m PyInstaller --clean --noconfirm --onefile --name source_debug --distpath binary --workpath binary/build/source-debug source/debug/source_debug.py
          mkdir -p binary/release/reti-emulator/libexec/reti-emulator binary/release/reti-emulator/source/debug
          cp binary/reti_emulator_main binary/release/reti-emulator/reti_emulator
          cp binary/source_debug binary/release/reti-emulator/libexec/reti-emulator/source_debug
          cp source/debug/source_debug.py binary/release/reti-emulator/source/debug/source_debug.py
          cp README.md binary/release/reti-emulator/README.md
          codesign --force --deep --sign - binary/release/reti-emulator/reti_emulator
          codesign --force --deep --sign - binary/release/reti-emulator/libexec/reti-emulator/source_debug
          tar -C binary/release -czf "$GITHUB_WORKSPACE/binary/${{ matrix.archive }}" reti-emulator

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: binary/${{ matrix.archive }}
          if-no-files-found: error

  android:
    name: Android 7+ ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            arch: aarch64
            target: aarch64-linux-android
            elf_machine: AArch64
            archive: reti-emulator-android-arm64.tar.gz
          - name: x86-64 smoke test
            arch: x86_64
            target: x86_64-linux-android
            elf_machine: Advanced Micro Devices X86-64
            archive: reti-emulator-android-x86_64-smoke.tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Download ncurses
        run: |
          mkdir -p binary/downloads binary/sources
          curl --fail --location --retry 3 \
            https://ftp.gnu.org/pub/gnu/ncurses/ncurses-6.5.tar.gz \
            --output binary/downloads/ncurses-6.5.tar.gz
          echo "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6  binary/downloads/ncurses-6.5.tar.gz" | sha256sum --check
          tar -C binary/sources -xzf binary/downloads/ncurses-6.5.tar.gz

      - name: Cross-compile ncurses
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          TARGET: ${{ matrix.target }}
        run: |
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          prefix="$GITHUB_WORKSPACE/binary/android-${{ matrix.arch }}/ncurses"
          export CC="$toolchain/bin/${TARGET}24-clang"
          export CXX="$toolchain/bin/${TARGET}24-clang++"
          export AR="$toolchain/bin/llvm-ar"
          export RANLIB="$toolchain/bin/llvm-ranlib"
          export STRIP="$toolchain/bin/llvm-strip"
          mkdir -p "binary/android-${{ matrix.arch }}/ncurses-build"
          cd "binary/android-${{ matrix.arch }}/ncurses-build"
          ../../sources/ncurses-6.5/configure \
            --host="$TARGET" \
            --prefix="$prefix" \
            --with-build-cc=gcc \
            --with-shared \
            --without-normal \
            --without-debug \
            --without-ada \
            --without-cxx-binding \
            --without-gpm \
            --disable-stripping \
            --enable-widec \
            --with-termlib \
            --with-default-terminfo-dir="$prefix/share/terminfo" \
            --with-terminfo-dirs="$prefix/share/terminfo"
          make -j2
          make install

      - name: Cross-compile and package RETI Emulator
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          TARGET: ${{ matrix.target }}
        run: |
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          prefix="$GITHUB_WORKSPACE/binary/android-${{ matrix.arch }}/ncurses"
          make \
            ANDROID=1 \
            RELEASE=1 \
            CC="$toolchain/bin/${TARGET}24-clang" \
            NCURSES_PREFIX="$prefix"
          "$toolchain/bin/llvm-readelf" -h binary/reti_emulator_main | \
            grep '${{ matrix.elf_machine }}' >/dev/null
          "$toolchain/bin/llvm-readelf" -d binary/reti_emulator_main | \
            grep 'libncursesw' >/dev/null
          "$toolchain/bin/llvm-nm" binary/reti_emulator_main | \
            grep 'cJSON_Parse' >/dev/null

          package="binary/android-${{ matrix.arch }}/reti-emulator"
          mkdir -p "$package/binary" "$package/lib" "$package/share" "$package/source/debug"
          cp binary/reti_emulator_main "$package/binary/reti_emulator_main"
          cp -a "$prefix"/lib/libncursesw.so* "$package/lib/"
          cp -a "$prefix"/lib/libtinfow.so* "$package/lib/"
          cp -R "$prefix/share/terminfo" "$package/share/terminfo"
          cp .github/release/android/reti_emulator "$package/reti_emulator"
          cp .github/release/android/README.md "$package/README.md"
          cp source/debug/source_debug.py "$package/source/debug/source_debug.py"
          cp README.md "$package/PROJECT_README.md"
          chmod 755 "$package/reti_emulator" "$package/binary/reti_emulator_main"
          tar -C "binary/android-${{ matrix.arch }}" -czf "$GITHUB_WORKSPACE/binary/${{ matrix.archive }}" reti-emulator

      - name: Allow the Android emulator to use KVM
        if: matrix.arch == 'x86_64'
        run: sudo chmod 666 /dev/kvm

      - name: Smoke test the Android package
        if: matrix.arch == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb push binary/android-x86_64/reti-emulator /data/local/tmp/reti-emulator
            adb push .github/release/android/smoke.reti /data/local/tmp/smoke.reti
            adb push .github/release/android/smoke.sections /data/local/tmp/smoke.sections
            adb shell chmod 755 /data/local/tmp/reti-emulator/reti_emulator /data/local/tmp/reti-emulator/binary/reti_emulator_main
            adb shell "cd /data/local/tmp && ./reti-emulator/reti_emulator -t -S smoke.sections smoke.reti"
            adb shell test -f /data/local/tmp/smoke.output

      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'aarch64'
        with:
          name: ${{ matrix.archive }}
          path: binary/${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
