<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-labelledby="title desc">
<title id="title">TSL DS ACC 2 instruction encoding</title><desc id="desc">Bits 31 to 30 are type 10, bits 29 to 28 mode 10, bits 27 to 25 source register DS 111, bits 24 to 22 destination register ACC 011, and bits 21 to 0 the signed immediate 2. The complete instruction is hexadecimal AEC00002.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
