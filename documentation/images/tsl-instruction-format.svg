<g font-family="DejaVu Sans, sans-serif" fill="#172536">
<text x="51" y="37" font-size="16" text-anchor="start" font-weight="normal" fill="#172536">31</text>
<text x="109" y="37" font-size="16" text-anchor="end" font-weight="normal" fill="#172536">30</text>
<rect x="48" y="52" width="64" height="88" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="80.0" y="88.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#172536">typ</text>
<text x="80.0" y="118.0" font-size="18" text-anchor="middle" font-weight="normal" fill="#172536">10</text>
